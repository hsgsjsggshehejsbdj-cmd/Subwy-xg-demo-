<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4aa3f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FOLLL — Flap the Sky!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%237ac74f'/><circle cx='16' cy='16' r='7' fill='%23ffd23f'/></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0f22;
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;border-radius:12px;
    box-shadow:0 18px 60px rgba(0,0,0,.55)}
  #rotate-hint{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(8,12,30,.85);color:#fff;font-size:18px;font-weight:bold;text-align:center;
    padding:24px;z-index:10;letter-spacing:1px;line-height:1.6}
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="rotate-hint">📱 Rotate your device to portrait to play FOLLL!</div>
<script>
"use strict";
(function(){
/* ============================================================
   FOLLL — a complete 2D arcade flappy-style game
   HTML5 Canvas engine, procedural art & Web Audio sounds.
   ============================================================ */

/* ---------- 0. Constants & global state ---------- */
const W = 480, H = 720;              // logical resolution (portrait)
const GROUND_H = 96;
const GROUND_Y = H - GROUND_H;
const PIPE_W = 72, CAP_H = 26;
const SPAWN_DX = 250;                // distance between pipe pairs
const GRAV = 0.5, FLAP_V = 7.6, MAX_FALL = 10.5;
const BIRD_R = 12;                   // fair hitbox radius

let state = "menu";                  // menu | playing | dying | paused | gameover
let stateT = 0;                      // time spent in current state (for anims)
let time = 0;                        // global animation clock
let score = 0, best = 0, newRecord = false;
let scorePop = 0, flash = 0, dim = 0, shake = 0;
let bird, pipes, particles, clouds;
let groundX = 0, scrollH1 = 0, scrollH2 = 0;
let dyingT = 0, dyingImpact = false;
let buttons = [];
let dpr = 1;

/* ---------- storage (safe for sandboxed / file:// contexts) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
best = store.get("foll_best", 0) || 0;
let soundOn = store.get("foll_sound", true) !== false;

/* ---------- canvas setup & responsive scaling ---------- */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function fit(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.round(W * s) + "px";
  canvas.style.height = Math.round(H * s) + "px";
}

/* ---------- helpers ---------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function rand(a, b){ return a + Math.random() * (b - a); }
function lerp(a, b, t){ return a + (b - a) * t; }
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circleRect(cx, cy, r, rx, ry, rw, rh){
  const nx = clamp(cx, rx, rx + rw);
  const ny = clamp(cy, ry, ry + rh);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

/* ---------- audio (procedural Web Audio synth) ---------- */
let audioCtx = null, master = null, musicActive = false, nextNoteTime = 0, musicIdx = 0;

function initAudio(){
  if(audioCtx) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
    master = audioCtx.createGain();
    master.gain.value = 0.5;
    master.connect(audioCtx.destination);
  }catch(e){ audioCtx = null; }
}
function resumeAudio(){
  if(audioCtx && audioCtx.state === "suspended"){ try{ audioCtx.resume(); }catch(e){} }
}
function beep(o){
  if(!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime + (o.delay || 0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = o.type || "square";
  osc.frequency.setValueAtTime(o.freq, t0);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(30, o.to), t0 + o.dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(o.vol || 0.3, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
  osc.connect(g).connect(master);
  osc.start(t0);
  osc.stop(t0 + o.dur + 0.05);
}
function noiseBurst(dur, vol){
  if(!soundOn || !audioCtx) return;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = audioCtx.createBufferSource();
  s.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  const f = audioCtx.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.value = 1400;
  s.connect(f).connect(g).connect(master);
  s.start();
}
/* sound effects */
const sfx = {
  flap(){ beep({freq:640, to:330, dur:0.09, type:"square", vol:0.16}); },
  score(){ beep({freq:880, dur:0.08, type:"square", vol:0.22}); beep({freq:1320, dur:0.12, type:"square", vol:0.2, delay:0.08}); },
  hit(){ noiseBurst(0.35, 0.5); beep({freq:180, to:60, dur:0.3, type:"sawtooth", vol:0.3}); },
  thud(){ beep({freq:120, to:60, dur:0.18, type:"triangle", vol:0.3}); },
  click(){ beep({freq:520, to:760, dur:0.06, type:"square", vol:0.1}); },
  start(){ beep({freq:523, dur:0.09, type:"square", vol:0.2}); beep({freq:784, dur:0.12, type:"square", vol:0.2, delay:0.09}); }
};
/* background music (light arcade arpeggios) */
const MUS_MENU = [[523,0.5],[659,0.5],[784,1],[659,0.5],[587,0.5],[523,1],[0,0.5],[0,0.5],
                  [659,0.5],[784,0.5],[1046,1],[880,0.5],[784,0.5],[659,1],[0,1.5]];
const MUS_PLAY = [[523,0.25],[523,0.25],[659,0.25],[784,0.25],[880,0.5],[784,0.25],[659,0.25],[523,0.5],
                  [659,0.25],[659,0.25],[784,0.25],[880,0.25],[1046,0.5],[880,0.25],[784,0.25],[659,0.5],
                  [587,0.25],[587,0.25],[659,0.25],[784,0.25],[988,0.5],[784,0.25],[659,0.25],[587,0.5],[0,0.5]];
function playNote(f, t, dur, vol){
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(master);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}
function updateMusic(){
  if(!audioCtx || !soundOn || (state !== "menu" && state !== "playing")){
    musicActive = false;
    return;
  }
  if(!musicActive){ musicIdx = 0; nextNoteTime = audioCtx.currentTime + 0.08; musicActive = true; }
  const beat = state === "playing" ? 60 / 132 : 60 / 96;
  const pat = state === "playing" ? MUS_PLAY : MUS_MENU;
  while(nextNoteTime < audioCtx.currentTime + 0.25){
    const n = pat[musicIdx % pat.length];
    musicIdx++;
    if(n[0] > 0) playNote(n[0], nextNoteTime, Math.max(0.05, n[1] * beat * 0.92), 0.05);
    nextNoteTime += n[1] * beat;
  }
}

/* ---------- world decoration data ---------- */
let dirtDots = [], grassTufts = [];
function initWorldData(){
  dirtDots = [];
  for(let i = 0; i < 22; i++) dirtDots.push({ dx: rand(0, W + 40), dy: GROUND_Y + rand(8, GROUND_H - 10) });
  grassTufts = [];
  for(let i = 0; i < 15; i++) grassTufts.push({ dx: i * 34 + rand(-6, 6), h: rand(6, 12) });
  clouds = [];
  for(let i = 0; i < 6; i++){
    clouds.push({ x: rand(-60, W + 60), y: rand(40, 250), s: rand(0.7, 1.25), layer: i < 3 ? 0 : 1 });
  }
}

/* ---------- bird & particles ---------- */
function makeBird(){
  return { x: 152, y: H * 0.42, vy: 0, rot: 0, wingPhase: 0, flapAnim: 0 };
}
function emitParticle(x, y, o){
  particles.push({
    x, y, vx: o.vx, vy: o.vy, g: o.g || 0,
    life: o.life, max: o.life, size: o.size, color: o.color,
    rot: o.rot || 0, vr: o.vr || 0, shape: o.shape || "circle"
  });
}
function emitFeathers(x, y){
  for(let i = 0; i < 2; i++){
    emitParticle(x - 6, y + rand(-4, 4), {
      vx: rand(-2.6, -1.2), vy: rand(-1.2, 0.6), g: 0.05,
      life: rand(0.35, 0.6), size: rand(2.5, 4),
      color: "rgba(255,240,170,0.95)", shape: "feather", vr: rand(-0.3, 0.3)
    });
  }
}
function emitBurst(x, y, n){
  const colors = ["#FFD23F", "#FF8A3D", "#FFFFFF", "#7AC74F", "#4A90D9"];
  for(let i = 0; i < n; i++){
    const a = rand(0, Math.PI * 2), sp = rand(2, 6.5);
    emitParticle(x, y, {
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5, g: 0.3,
      life: rand(0.6, 1.2), size: rand(2.5, 5),
      color: colors[(Math.random() * colors.length) | 0],
      shape: Math.random() < 0.4 ? "feather" : "circle", vr: rand(-0.4, 0.4)
    });
  }
}
function emitSparkles(x, y){
  emitParticle(x + rand(-16, 16), y + rand(-10, 10), {
    vx: rand(-1, 1), vy: rand(-1.6, -0.4), g: -0.02,
    life: rand(0.4, 0.8), size: rand(2, 3.5),
    color: "rgba(255,225,120,0.95)", shape: "star", vr: rand(-0.2, 0.2)
  });
}

/* ---------- difficulty curve ---------- */
function curSpeed(){ return Math.min(2.6 + score * 0.08, 4.2); }
function curGap(){
  const base = Math.max(128, 174 - Math.min(score, 22) * 2);
  return base + Math.random() * 20;
}

/* ---------- game flow ---------- */
function setState(s){
  state = s;
  stateT = 0;
  rebuildButtons();
}
function startGame(){
  score = 0; scorePop = 0; newRecord = false;
  bird = makeBird();
  pipes = [];
  particles = [];
  groundX = 0; scrollH1 = 0; scrollH2 = 0;
  // first pipe is fair: gap centred on the bird's start
  const gapH = curGap();
  const minTop = 80, maxTop = GROUND_Y - gapH - 14;
  pipes.push({
    x: W + 50, gapY: clamp(bird.y - gapH / 2, minTop, maxTop),
    gapH: gapH, passed: false
  });
  flash = 1;
  sfx.start();
  setState("playing");
}
function flap(){
  if(state !== "playing") return;
  bird.vy = -FLAP_V;
  bird.flapAnim = 1;
  emitFeathers(bird.x - 6, bird.y);
  sfx.flap();
}
function startDying(){
  if(state !== "playing") return;
  setState("dying");
  dyingT = 0; dyingImpact = false;
  bird.vy = -2.5;
  sfx.hit();
  shake = 10;
  emitBurst(bird.x, bird.y, 8);
}
function pauseGame(){ if(state === "playing") setState("paused"); }
function resumeGame(){
  if(state === "paused"){ setState("playing"); }
}
function goMenu(){ setState("menu"); }
function toggleSound(){
  soundOn = !soundOn;
  store.set("foll_sound", soundOn);
  if(soundOn && audioCtx) musicActive = false; // updateMusic() will restart it
  sfx.click();
}

/* ---------- buttons ---------- */
function rebuildButtons(){
  const sb = { x: W - 58, y: 16, w: 48, h: 48, kind: "sound", action: toggleSound, hover: 0, press: 0 };
  buttons = [];
  switch(state){
    case "menu":
      buttons.push({ x: 140, y: 446, w: 200, h: 68, label: "PLAY", primary: true, action: startGame, hover: 0, press: 0 });
      break;
    case "playing":
      buttons.push({ x: W - 122, y: 16, w: 48, h: 48, kind: "pause", action: pauseGame, hover: 0, press: 0 });
      break;
    case "paused":
      buttons.push({ x: 140, y: 344, w: 200, h: 62, label: "RESUME", primary: true, action: resumeGame, hover: 0, press: 0 });
      buttons.push({ x: 140, y: 424, w: 200, h: 56, label: "RESTART", action: startGame, hover: 0, press: 0 });
      break;
    case "gameover":
      buttons.push({ x: 140, y: 480, w: 200, h: 64, label: "RESTART", primary: true, action: startGame, hover: 0, press: 0 });
      buttons.push({ x: 140, y: 558, w: 200, h: 52, label: "MENU", action: goMenu, hover: 0, press: 0 });
      break;
  }
  buttons.push(sb);
}
function hitBtn(b, x, y){ return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }

/* ---------- input ---------- */
function toLocal(e){
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) / rect.width * W, y: (e.clientY - rect.top) / rect.height * H };
}
canvas.addEventListener("pointerdown", function(e){
  e.preventDefault();
  initAudio(); resumeAudio();
  const p = toLocal(e);
  for(const b of buttons){
    if(hitBtn(b, p.x, p.y)){
      b.press = 1;
      b.action();
      return;
    }
  }
  if(state === "playing") flap();
});
canvas.addEventListener("pointermove", function(e){
  if(e.pointerType !== "mouse") return;
  const p = toLocal(e);
  let any = false;
  for(const b of buttons){
    const h = hitBtn(b, p.x, p.y);
    b.hover = h ? 1 : 0;
    if(h) any = true;
  }
  canvas.style.cursor = any ? "pointer" : "default";
});
canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });
window.addEventListener("keydown", function(e){
  if(e.code === "Space" || e.code === "Enter"){
    e.preventDefault();
    initAudio(); resumeAudio();
    if(state === "menu") startGame();
    else if(state === "playing") flap();
    else if(state === "paused") resumeGame();
    else if(state === "gameover") startGame();
    return;
  }
  if(e.code === "KeyP" || e.code === "Escape"){
    e.preventDefault();
    if(state === "playing") pauseGame();
    else if(state === "paused") resumeGame();
    return;
  }
  if(e.code === "KeyR"){
    e.preventDefault();
    if(state !== "menu") startGame();
  }
});
document.addEventListener("visibilitychange", function(){
  if(document.hidden && state === "playing") pauseGame();
});
window.addEventListener("blur", function(){
  if(state === "playing") pauseGame();
});
function checkOrientationHint(){
  const hint = document.getElementById("rotate-hint");
  const touch = typeof window.matchMedia === "function" && window.matchMedia("(pointer:coarse)").matches;
  hint.style.display = (touch && window.innerWidth > window.innerHeight) ? "flex" : "none";
}
window.addEventListener("resize", function(){ fit(); checkOrientationHint(); });
window.addEventListener("orientationchange", checkOrientationHint);

/* ---------- update logic ---------- */
function updateBirdAnim(dt, f){
  if(state === "menu"){
    bird.wingPhase += dt * 13;
  }else if(state === "playing"){
    if(bird.flapAnim > 0){ bird.wingPhase += dt * 14; bird.flapAnim = Math.max(0, bird.flapAnim - dt * 2.2); }
    else bird.wingPhase += dt * 3.5;
  }else if(state === "dying"){
    bird.wingPhase += dt * 2;
  }
}
function updateDecor(dt, f){
  let ws = 0.5;
  if(state === "playing") ws = curSpeed();
  else if(state === "dying") ws = 0.15;
  else if(state === "gameover") ws = 0.25;
  groundX += ws * f;
  scrollH1 += ws * 0.2 * f;
  scrollH2 += ws * 0.45 * f;
  for(const c of clouds){
    c.x -= (0.12 + c.layer * 0.22) * ws * f;
    const minX = -110 * c.s;
    if(c.x < minX){
      c.x = W + 80 * c.s + rand(0, 60);
      c.y = rand(40, 250);
      c.s = rand(0.7, 1.25);
    }
  }
}
function updateParticles(dt, f){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * f;
    p.y += p.vy * f;
    p.vy += p.g * f;
    p.rot += p.vr * f;
  }
}
function updatePlaying(dt, f){
  const sp = curSpeed();
  bird.vy += GRAV * f;
  if(bird.vy > MAX_FALL) bird.vy = MAX_FALL;
  bird.y += bird.vy * f;
  if(bird.y < BIRD_R){ bird.y = BIRD_R; bird.vy = 0; }
  const rotTarget = clamp(bird.vy * 4.5, -0.55, 1.35);
  bird.rot = lerp(bird.rot, rotTarget, Math.min(1, 0.18 * f));

  for(const p of pipes) p.x -= sp * f;
  pipes = pipes.filter(p => p.x + PIPE_W > -20);

  // score when passing
  for(const p of pipes){
    if(!p.passed && p.x + PIPE_W < bird.x){
      p.passed = true;
      score++;
      scorePop = 1;
      sfx.score();
    }
  }
  // spawn
  const last = pipes[pipes.length - 1];
  if(!last || last.x < W - SPAWN_DX){
    const gapH = curGap();
    const minTop = 80, maxTop = GROUND_Y - gapH - 14;
    pipes.push({ x: W + 10, gapY: minTop + Math.random() * (maxTop - minTop), gapH: gapH, passed: false });
  }
  // collisions
  for(const p of pipes){
    if(circleRect(bird.x, bird.y, BIRD_R, p.x, 0, PIPE_W, p.gapY)) return startDying();
    if(circleRect(bird.x, bird.y, BIRD_R, p.x, p.gapY + p.gapH, PIPE_W, GROUND_Y - (p.gapY + p.gapH))) return startDying();
  }
  if(bird.y + BIRD_R >= GROUND_Y) return startDying();
}
function updateDying(dt, f){
  bird.vy += GRAV * f;
  bird.y += bird.vy * f;
  bird.rot = lerp(bird.rot, 1.4, Math.min(1, 0.22 * f));
  if(bird.y >= GROUND_Y - BIRD_R){
    bird.y = GROUND_Y - BIRD_R;
    bird.vy = 0;
    if(!dyingImpact){
      dyingImpact = true;
      emitBurst(bird.x, GROUND_Y - 4, 20);
      shake = 12;
      sfx.thud();
    }
  }
  dyingT += dt;
  if(dyingT > 0.7){
    if(score > best){ best = score; newRecord = true; store.set("foll_best", best); }
    setState("gameover");
  }
}
function update(dt){
  if(state !== "paused") time += dt;
  const f = dt * 60;
  updateDecor(dt, f);
  updateBirdAnim(dt, f);
  updateParticles(dt, f);
  for(const b of buttons) b.press *= 0.85;

  if(state === "playing") updatePlaying(dt, f);
  else if(state === "dying") updateDying(dt, f);

  if(state === "gameover" && newRecord && Math.random() < dt * 6) emitSparkles(320, 346);

  scorePop = Math.max(0, scorePop - dt * 3.2);
  flash = Math.max(0, flash - dt * 2.6);
  shake = Math.max(0, shake - dt * 30);
  const targetDim = (state === "paused" || state === "gameover") ? 0.55 : 0;
  dim = lerp(dim, targetDim, Math.min(1, dt * 6));
  updateMusic();
}

/* ---------- drawing: world ---------- */
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, "#2E86E0");
  g.addColorStop(0.55, "#6FB9F2");
  g.addColorStop(1, "#C9E9FF");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y + 4);
}
function drawSun(){
  const x = W - 86, y = 78;
  ctx.fillStyle = "rgba(255,244,170,0.35)";
  ctx.beginPath(); ctx.arc(x, y, 62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#FFF3C4";
  ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.beginPath(); ctx.arc(x - 9, y - 9, 10, 0, Math.PI * 2); ctx.fill();
}
function drawCloud(x, y, s){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = "rgba(180,222,252,0.9)";
  ctx.beginPath();
  ctx.arc(-28, 8, 17, 0, 7); ctx.arc(-8, 2, 23, 0, 7);
  ctx.arc(16, 6, 19, 0, 7); ctx.arc(2, 13, 21, 0, 7);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.98)";
  ctx.beginPath();
  ctx.arc(-26, 0, 14, 0, 7); ctx.arc(-6, -9, 19, 0, 7);
  ctx.arc(14, -1, 16, 0, 7);
  ctx.fill();
  ctx.restore();
}
function drawHills(scroll, baseY, amp, freq, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for(let xx = 0; xx <= W; xx += 8){
    const yy = baseY - amp * Math.abs(Math.sin((xx + scroll) * freq));
    ctx.lineTo(xx, yy);
  }
  ctx.lineTo(W, GROUND_Y);
  ctx.closePath();
  ctx.fill();
}
function drawPipeBody(x, y0, y1, g){
  const h = y1 - y0;
  if(h <= 0) return;
  ctx.fillStyle = g;
  ctx.fillRect(x, y0, PIPE_W, h);
  ctx.fillStyle = "rgba(255,255,255,0.28)";
  ctx.fillRect(x + 8, y0, 10, h);
  ctx.fillStyle = "rgba(0,40,0,0.25)";
  ctx.fillRect(x + PIPE_W - 9, y0, 9, h);
  ctx.fillStyle = "rgba(0,35,0,0.12)";
  ctx.fillRect(x + PIPE_W * 0.3, y0, 5, h);
  ctx.fillRect(x + PIPE_W * 0.68, y0, 5, h);
  ctx.strokeStyle = "#2E5A1E";
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y0, PIPE_W, h);
}
function drawPipeCap(x, y, g){
  ctx.fillStyle = g;
  ctx.fillRect(x - 4, y, PIPE_W + 8, CAP_H);
  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.fillRect(x + 3, y + 4, 10, CAP_H - 8);
  ctx.fillStyle = "rgba(0,40,0,0.28)";
  ctx.fillRect(x + PIPE_W - 3, y + 4, 9, CAP_H - 8);
  ctx.strokeStyle = "#2E5A1E";
  ctx.lineWidth = 3;
  ctx.strokeRect(x - 4, y, PIPE_W + 8, CAP_H);
  ctx.fillStyle = "rgba(0,35,0,0.18)";
  ctx.fillRect(x - 4, y + CAP_H - 5, PIPE_W + 8, 5);
}
function pipeGradient(){
  const g = ctx.createLinearGradient(0, 0, PIPE_W, 0);
  g.addColorStop(0, "#B7E86B");
  g.addColorStop(0.18, "#8FD455");
  g.addColorStop(0.62, "#7AC74F");
  g.addColorStop(1, "#4E9E2C");
  return g;
}
function drawPipe(p){
  const g = pipeGradient();
  drawPipeBody(p.x, 0, p.gapY - CAP_H, g);
  drawPipeCap(p.x, p.gapY - CAP_H, g);
  drawPipeBody(p.x, p.gapY + p.gapH + CAP_H, GROUND_Y, g);
  drawPipeCap(p.x, p.gapY + p.gapH, g);
}
function drawGround(){
  // dirt
  const dg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  dg.addColorStop(0, "#D8A05F");
  dg.addColorStop(1, "#B9823F");
  ctx.fillStyle = dg;
  ctx.fillRect(0, GROUND_Y, W, GROUND_H);
  // scrolling dirt dots
  ctx.fillStyle = "rgba(150,105,55,0.5)";
  for(const d of dirtDots){
    const x = ((d.dx - groundX * 0.6) % (W + 40) + W + 40) % (W + 40) - 20;
    ctx.beginPath(); ctx.arc(x, d.dy, 3, 0, Math.PI * 2); ctx.fill();
  }
  // grass strip with diagonal stripes
  ctx.fillStyle = "#8AD45C";
  ctx.fillRect(0, GROUND_Y, W, 20);
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  for(let i = -1; i < 12; i++){
    const sx = ((i * 46 - groundX) % (W + 46) + W + 46) % (W + 46) - 23;
    ctx.beginPath();
    ctx.moveTo(sx, GROUND_Y);
    ctx.lineTo(sx + 16, GROUND_Y);
    ctx.lineTo(sx + 6, GROUND_Y + 20);
    ctx.lineTo(sx - 10, GROUND_Y + 20);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = "#6BBF45";
  ctx.fillRect(0, GROUND_Y, W, 5);
  // grass tufts
  ctx.fillStyle = "#7CC84E";
  for(const t of grassTufts){
    const x = ((t.dx - groundX) % (W + 40) + W + 40) % (W + 40) - 20;
    ctx.beginPath();
    ctx.moveTo(x - 3, GROUND_Y);
    ctx.lineTo(x, GROUND_Y - t.h);
    ctx.lineTo(x + 3, GROUND_Y);
    ctx.closePath();
    ctx.fill();
  }
}

/* ---------- drawing: bird ---------- */
function drawBird(x, y, rot, wingPhase, scale){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  if(scale && scale !== 1) ctx.scale(scale, scale);
  const frame = Math.floor(wingPhase) % 3;
  const wingAngle = [-0.5, 0.05, 0.65][frame] + Math.sin(wingPhase * Math.PI * 2) * 0.06;

  // tail feathers
  ctx.fillStyle = "#FFC93C";
  ctx.strokeStyle = "#7A4A00";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-13, -4); ctx.lineTo(-22, -8); ctx.lineTo(-15, 1); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-13, 2); ctx.lineTo(-21, 3); ctx.lineTo(-14, 7); ctx.closePath();
  ctx.fill(); ctx.stroke();

  // body
  const bg = ctx.createRadialGradient(-4, -5, 3, 0, 0, 22);
  bg.addColorStop(0, "#FFE98A");
  bg.addColorStop(0.6, "#FFD23F");
  bg.addColorStop(1, "#F2A007");
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, 0, 17, 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = "#7A4A00";
  ctx.stroke();

  // belly highlight
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.beginPath();
  ctx.ellipse(-2, 5, 10, 5.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // wing (3-frame flapping animation)
  ctx.save();
  ctx.translate(-3, 1);
  ctx.rotate(wingAngle);
  ctx.fillStyle = "#FFC93C";
  ctx.beginPath();
  ctx.ellipse(-4, 2, 12, 6.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = "#7A4A00";
  ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.beginPath();
  ctx.ellipse(-6, 0, 6, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // cheek blush
  ctx.fillStyle = "rgba(255,110,80,0.45)";
  ctx.beginPath();
  ctx.ellipse(2, 5, 3.5, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // eye
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath(); ctx.arc(7, -5, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#7A4A00";
  ctx.stroke();
  ctx.fillStyle = "#23232B";
  ctx.beginPath(); ctx.arc(8.5, -5, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath(); ctx.arc(9.6, -6.4, 1.3, 0, Math.PI * 2); ctx.fill();

  // beak
  ctx.fillStyle = "#FF8A3D";
  ctx.strokeStyle = "#D96A1F";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(13, -1); ctx.lineTo(22, 1); ctx.lineTo(13, 4.5); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(13, 3); ctx.lineTo(18, 4.5); ctx.lineTo(13, 6); ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.restore();
}
function drawShadow(){
  if(state !== "playing" && state !== "dying") return;
  const h = Math.max(0, GROUND_Y - bird.y - BIRD_R);
  const a = Math.max(0.05, 0.35 - h / 320);
  const s = Math.max(0.4, 1 - h / 420);
  ctx.fillStyle = "rgba(0,0,0," + a + ")";
  ctx.beginPath();
  ctx.ellipse(bird.x, GROUND_Y - 2, 15 * s, 5 * s, 0, 0, Math.PI * 2);
  ctx.fill();
}
function drawParticles(){
  for(const p of particles){
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    if(p.shape === "feather"){
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size * 1.7, p.size, 0, 0, Math.PI * 2);
      ctx.fill();
    }else if(p.shape === "star"){
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size * 1.6, -p.size * 0.4, p.size * 3.2, p.size * 0.8);
      ctx.fillRect(-p.size * 0.4, -p.size * 1.6, p.size * 0.8, p.size * 3.2);
    }else{
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------- drawing: UI ---------- */
function drawText(text, x, y, size, fill, stroke, align, lw){
  ctx.font = "900 " + size + 'px "Trebuchet MS","Segoe UI",system-ui,sans-serif';
  ctx.textAlign = align || "center";
  ctx.textBaseline = "alphabetic";
  ctx.lineWidth = lw || Math.max(4, size * 0.14);
  ctx.strokeStyle = stroke || "rgba(20,25,45,0.85)";
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}
function drawLogo(){
  const letters = "FOLLL";
  const size = 80;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.font = "900 " + size + 'px "Trebuchet MS","Segoe UI",system-ui,sans-serif';
  const widths = [];
  let total = 0;
  for(const ch of letters){ const w = ctx.measureText(ch).width; widths.push(w); total += w; }
  let x = W / 2 - total / 2;
  const y = 272;
  for(let i = 0; i < letters.length; i++){
    const ch = letters[i];
    const bob = Math.sin(time * 3 + i * 0.8) * 5;
    const yy = y + bob;
    ctx.font = "900 " + size + 'px "Trebuchet MS","Segoe UI",system-ui,sans-serif';
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(20,30,50,0.28)";
    ctx.fillText(ch, x, yy + 8);
    ctx.lineWidth = 10;
    ctx.strokeStyle = "#5A2E00";
    ctx.strokeText(ch, x, yy);
    const g = ctx.createLinearGradient(0, yy - size, 0, yy);
    g.addColorStop(0, "#FFF3C4");
    g.addColorStop(0.5, "#FFC93C");
    g.addColorStop(1, "#FB8500");
    ctx.fillStyle = g;
    ctx.fillText(ch, x, yy);
    x += widths[i];
  }
}
function drawBigButton(b, primary, appear){
  if(appear <= 0) return;
  const ease = 1 + 2.7 * Math.pow(appear - 1, 3) + 1.7 * Math.pow(appear - 1, 2);
  const sc = (0.6 + 0.4 * Math.min(1, ease)) * (1 + b.hover * 0.06 - b.press * 0.06);
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  ctx.save();
  ctx.globalAlpha = Math.min(1, appear);
  ctx.translate(cx, cy);
  ctx.scale(sc, sc);
  ctx.translate(-cx, -cy);
  ctx.shadowColor = primary ? "rgba(255,170,40,0.9)" : "rgba(0,0,0,0.4)";
  ctx.shadowBlur = primary ? 20 + 8 * Math.sin(time * 5) : 10;
  rr(b.x, b.y, b.w, b.h, 16);
  const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
  if(primary){
    g.addColorStop(0, "#FFE066");
    g.addColorStop(0.5, "#FFB703");
    g.addColorStop(1, "#FB8500");
  }else{
    g.addColorStop(0, "#FFFFFF");
    g.addColorStop(1, "#E4ECF7");
  }
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 5;
  ctx.strokeStyle = primary ? "#8A4B00" : "#3A4A66";
  ctx.stroke();
  ctx.font = "900 " + Math.round(b.h * 0.42) + 'px "Trebuchet MS","Segoe UI",system-ui,sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = primary ? "#5A2E00" : "#22314E";
  ctx.fillText(b.label, cx, cy + 2);
  ctx.restore();
}
function drawIconButton(b, appear){
  if(appear <= 0) return;
  const sc = (0.6 + 0.4 * Math.min(1, 1 + 2.7 * Math.pow(Math.min(1, appear) - 1, 3) + 1.7 * Math.pow(Math.min(1, appear) - 1, 2)))
    * (1 + b.hover * 0.08 - b.press * 0.08);
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  ctx.save();
  ctx.globalAlpha = Math.min(1, appear);
  ctx.translate(cx, cy);
  ctx.scale(sc, sc);
  ctx.translate(-cx, -cy);
  rr(b.x, b.y, b.w, b.h, 12);
  ctx.fillStyle = "rgba(255,255,255,0.16)";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.stroke();
  ctx.fillStyle = "#FFFFFF";
  if(b.kind === "pause"){
    ctx.fillRect(cx - 8, cy - 9, 5, 18);
    ctx.fillRect(cx + 3, cy - 9, 5, 18);
  }else{
    ctx.beginPath();
    ctx.moveTo(cx - 9, cy - 4);
    ctx.lineTo(cx - 3, cy - 4);
    ctx.lineTo(cx + 1, cy - 8.5);
    ctx.lineTo(cx + 1, cy + 8.5);
    ctx.lineTo(cx - 3, cy + 4);
    ctx.lineTo(cx - 9, cy + 4);
    ctx.closePath();
    ctx.fill();
    if(soundOn){
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#FFFFFF";
      ctx.beginPath(); ctx.arc(cx + 7, cy, 6, -0.8, 0.8); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + 7, cy, 10.5, -0.65, 0.65); ctx.stroke();
    }else{
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = "#FF8A8A";
      ctx.beginPath();
      ctx.moveTo(cx + 5, cy - 6); ctx.lineTo(cx + 13, cy + 6);
      ctx.moveTo(cx + 13, cy - 6); ctx.lineTo(cx + 5, cy + 6);
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawButtons(){
  for(let i = 0; i < buttons.length; i++){
    const b = buttons[i];
    const appear = Math.max(0, Math.min(1, stateT * 3.2 - i * 0.12));
    if(b.kind) drawIconButton(b, appear);
    else drawBigButton(b, b.primary !== false, appear);
  }
}
function drawMenuUI(){
  // mascot bird bobbing above the logo
  drawBird(W / 2, 152 + Math.sin(time * 2.6) * 10, Math.sin(time * 2.2) * 0.14, bird.wingPhase, 1.15);
  drawLogo();
  drawText("FLAP THE SKY!", W / 2, 330, 27, "#FFFFFF", "rgba(20,25,45,0.9)");
  drawText("BEST  " + String(best).padStart(2, "0"), W / 2, 540, 26, "#FFE9A8", "rgba(20,25,45,0.85)");
  drawText("TAP / CLICK / SPACE  TO  FLAP", W / 2, 610, 19, "rgba(255,255,255,0.92)", "rgba(20,25,45,0.8)");
  drawText("FOLLL  ·  ARCADE EDITION", W / 2, 668, 15, "rgba(255,255,255,0.55)", "rgba(20,25,45,0.6)");
}
function drawInGameHUD(){
  const sc = 1 + scorePop * 0.35;
  ctx.save();
  ctx.translate(W / 2, 92);
  ctx.scale(sc, sc);
  drawText(String(score), 0, 0, 58, "#FFFFFF", "rgba(20,25,50,0.9)");
  ctx.restore();
  drawText("BEST " + String(best).padStart(2, "0"), 30, 46, 20, "#FFE9A8", "rgba(20,25,50,0.85)", "left", 4);
}
function drawPauseUI(){
  drawText("PAUSED", W / 2, 260, 64, "#FFFFFF", "rgba(20,40,90,0.9)");
  drawText("TAP RESUME OR PRESS SPACE", W / 2, 312, 18, "rgba(255,255,255,0.85)", "rgba(20,25,45,0.8)");
}
function drawGameOverUI(){
  drawText("GAME OVER", W / 2, 208, 52, "#FF5A5A", "rgba(120,25,25,0.95)");
  // panel
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.45)";
  ctx.shadowBlur = 18;
  rr(88, 244, 304, 226, 20);
  ctx.fillStyle = "rgba(255,255,255,0.96)";
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = "#2A3A5C";
  ctx.stroke();
  ctx.restore();
  ctx.textAlign = "left";
  ctx.font = "900 20px \"Trebuchet MS\",\"Segoe UI\",system-ui,sans-serif";
  ctx.fillStyle = "#8A97AE";
  ctx.fillText("SCORE", 122, 302);
  ctx.fillText("BEST", 122, 372);
  ctx.textAlign = "right";
  ctx.font = "900 44px \"Trebuchet MS\",\"Segoe UI\",system-ui,sans-serif";
  ctx.fillStyle = "#22314E";
  ctx.fillText(String(score), 378, 304);
  ctx.fillText(String(best), 378, 374);
  if(newRecord){
    const pulse = 1 + 0.12 * Math.sin(time * 8);
    ctx.save();
    ctx.translate(268, 352);
    ctx.scale(pulse, pulse);
    rr(-34, -15, 72, 30, 15);
    ctx.fillStyle = "#2ECC71";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#1B7A43";
    ctx.stroke();
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "900 20px \"Trebuchet MS\",\"Segoe UI\",system-ui,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("NEW!", 0, 1);
    ctx.restore();
  }
  ctx.textBaseline = "alphabetic";
  drawText("PRESS SPACE OR TAP RESTART", W / 2, 640, 17, "rgba(255,255,255,0.8)", "rgba(20,25,45,0.75)");
}
function drawHUD(){
  switch(state){
    case "menu": drawMenuUI(); break;
    case "playing":
    case "dying": drawInGameHUD(); break;
    case "paused": drawInGameHUD(); drawPauseUI(); break;
    case "gameover": drawGameOverUI(); break;
  }
}
function drawVignette(){
  const g = ctx.createRadialGradient(W / 2, H * 0.45, W * 0.35, W / 2, H * 0.45, W * 0.85);
  g.addColorStop(0, "rgba(8,12,35,0)");
  g.addColorStop(1, "rgba(8,12,35,0.3)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- main draw ---------- */
function draw(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if(shake > 0.2){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawSky();
  drawSun();
  for(const c of clouds) drawCloud(c.x, c.y, c.s);
  drawHills(scrollH1, GROUND_Y - 46, 30, 0.011, "#A8E0B8");
  drawHills(scrollH2, GROUND_Y - 26, 20, 0.017, "#86D39B");
  for(const p of pipes) drawPipe(p);
  drawGround();
  drawShadow();
  if(state !== "menu") drawBird(bird.x, bird.y, bird.rot, bird.wingPhase, 1);
  drawParticles();
  drawHUD();
  ctx.restore();

  if(dim > 0.01){
    ctx.fillStyle = "rgba(8,12,30," + dim + ")";
    ctx.fillRect(0, 0, W, H);
  }
  drawButtons();
  if(flash > 0.01){
    ctx.fillStyle = "rgba(255,255,255," + (flash * 0.7) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  drawVignette();
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;
  update(dt);
  stateT += dt;
  draw();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
fit();
checkOrientationHint();
initWorldData();
bird = makeBird();
pipes = [];
particles = [];
rebuildButtons();
requestAnimationFrame(frame);

/* debug/test hook (harmless in browser) */
window.FOLLL = {
  get state(){ return state; },
  get score(){ return score; },
  get best(){ return best; },
  get birdY(){ return bird ? bird.y : -1; },
  get pipesInfo(){ return pipes ? pipes.map(p => ({ x: p.x, gapY: p.gapY, gapH: p.gapH })) : []; },
  start: startGame,
  flap: flap,
  pause: pauseGame,
  resume: resumeGame,
  toggleSound: toggleSound,
  step(dt){ update(dt); stateT += dt; },
  draw: draw
};
})();
</script>
</body>
