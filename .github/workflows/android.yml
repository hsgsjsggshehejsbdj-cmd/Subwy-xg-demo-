name: Build SUBWY XG APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract game
        run: unzip SUBWY_XG_ANDROID_BUILD.zip

      - name: Install Capacitor
        working-directory: SUBWY_XG_DEMO
        run: npm install

      - name: Create Android project
        working-directory: SUBWY_XG_DEMO
        run: npx cap add android

      - name: Sync game
        working-directory: SUBWY_XG_DEMO
        run: npx cap sync android

      - name: Build APK
        working-directory: SUBWY_XG_DEMO/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUBWY-XG-APK
          path: SUBWY_XG_DEMO/android/app/build/outputs/apk/debug/app-debug.apk
